name: CI
on:
  push:
  pull_request:
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true
      - run: go mod tidy
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build ./...
      - run: go test -tags=integration -v ./tests/integration
