name: CI
on:
  push:
  pull_request:
jobs:
  go:
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true
      - run: go mod tidy
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build ./...
      - run: make test-resources-up
      - name: Run integration tests individually
        shell: bash
        run: |
          mapfile -t tests < <(go test -tags=integration -list '^Test' ./tests/integration | sed -n '/^Test[A-Za-z0-9_]*$/p')
          test "${#tests[@]}" -gt 0
          for test_name in "${tests[@]}"; do
            make integration TEST="$test_name"
          done
      - if: always()
        run: make test-resources-down
